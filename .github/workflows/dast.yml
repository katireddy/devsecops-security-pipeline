name: DAST - OWASP ZAP

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build demo image
        run: docker build -t devsecops-demo:local .
      - name: Start isolated demo
        run: |
          docker run -d --rm --name devsecops-demo -p 127.0.0.1:5000:5000 devsecops-demo:local
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:5000/health; then exit 0; fi
            sleep 2
          done
          docker logs devsecops-demo
          exit 1
      - name: OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:5000"
          fail_action: true
          allow_issue_writing: false
      - name: Stop demo
        if: always()
        run: docker stop devsecops-demo || true
